name: ci-selftest
# ============================================================================
# 这个文件是一个**诊断用的最小工作流**，用途只有一个：
#   区分下面两种完全不同的故障，因为它们需要完全不同的修法：
#     (A) 我的 update-lottery.yml 本身有问题；
#     (B) 这个仓库/账号层面根本没有执行 Actions 的权限。
#
# 它的内容刻意做到最简：一个 job、一个 step、只 echo 一行字。
# 没有中文、没有中文注释以外的任何东西、没有 concurrency、没有 permissions、
# 没有 schedule、没有 paths 过滤、没有 if 条件——把所有可能出问题的语法都排除掉。
#
# 判读方法：
#   · 如果它跑起来了 → 说明 Actions 正常，问题出在 update-lottery.yml 的内容上；
#   · 如果它同样"No jobs were run" → 说明是仓库/账号层面的权限问题，
#     再改 YAML 也没有意义。
#
# 结论确定之后，这个文件应当被删除（它不属于正式流水线）。
# ============================================================================

on:
  push:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo "self-test workflow executed successfully"
